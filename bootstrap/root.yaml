apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Kofie4ik/k8s-stand.git
    targetRevision: main
    path: apps          # тут лежат другие Application

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd   # Application-объекты живут в ns argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
