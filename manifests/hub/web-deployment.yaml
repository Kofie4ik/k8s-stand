apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-web
  namespace: hub
spec:
  replicas: 1
  selector:
    matchLabels: { app: hub-web }
  template:
    metadata:
      labels: { app: hub-web }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            # Монтирование внутрь уже смонтированного тома — обычное дело:
            # kubelet раскладывает тома по длине пути, поэтому fonts/ ложится
            # поверх html/, а не затирает его.
            - name: fonts
              mountPath: /usr/share/nginx/html/fonts
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests: { memory: "16Mi", cpu: "10m" }
            limits:   { memory: "64Mi", cpu: "100m" }
      volumes:
        - name: fonts
          configMap:
            name: hub-fonts
        - name: nginx-conf
          configMap:
            name: hub-nginx
        - name: html
          configMap:
            # имя без хвоста: kustomize сам подставит сюда сгенерированное
            # имя с хешем содержимого — правка index.html меняет хеш, меняет
            # имя ConfigMap и тем самым перезапускает под. Ровно то, чего
            # не хватало в 18-й части, где ConfigMap приходилось пересоздавать.
            name: hub-html
