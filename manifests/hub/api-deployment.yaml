apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-api
  namespace: hub
spec:
  replicas: 1
  selector:
    matchLabels: { app: hub-api }
  template:
    metadata:
      labels: { app: hub-api }
    spec:
      containers:
        - name: api
          image: registry.pivasik.org/hub-api:0.2.0
          # образ тянется из своего реестра по паролю из registries.yaml;
          # тег числовой, поэтому лишний поход в сеть при перезапуске не нужен
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            # адрес Prometheus — не секрет, живёт в ConfigMap
            - name: PROM_URL
              valueFrom:
                configMapKeyRef: { name: hub-config, key: PROM_URL }
            # строка подключения с паролем и оба ключа — из Secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: hub-secrets, key: DATABASE_URL }
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: hub-secrets, key: SESSION_SECRET }
            - name: CLUSTER_TOKEN
              valueFrom:
                secretKeyRef: { name: hub-secrets, key: CLUSTER_TOKEN }
          resources:
            requests: { memory: "96Mi",  cpu: "50m" }
            limits:   { memory: "384Mi", cpu: "500m" }
          # Жив ли процесс. Базу здесь НЕ проверяем: иначе её пятисекундная
          # недоступность превратится в бесконечный перезапуск здорового
          # приложения — а перезапуск базу, разумеется, не чинит.
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          # Готов ли обслуживать: процесс жив И база отвечает. Пока не готов,
          # Service просто не шлёт на него трафик — под при этом не убивают.
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
