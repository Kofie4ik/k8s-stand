# Конфиг nginx для hub-web. Едет в кластер ConfigMap'ом и монтируется в
# /etc/nginx/conf.d/default.conf, заменяя стандартный.
#
# Задач у него три: отдавать разделы по настоящим адресам, честно отвечать 404
# на всё остальное и не давать браузеру кешировать саму страницу, чтобы правка
# доезжала сразу после того, как Argo перезапустил под.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности. Страница ничего не тянет извне, поэтому политика
    # получается короткой. Оговорки две:
    #   'unsafe-inline' — весь скрипт и стили лежат внутри index.html. Можно
    #     было бы разрешить их по хешу, но хеш меняется от каждой правки html,
    #     и конфиг пришлось бы править вместе со страницей. Для одного файла,
    #     который никто, кроме нас, не пишет, обмен честный.
    #   connect-src с *.pivasik.org — иначе браузер зарубит пробы сервисов:
    #     они уходят на соседние поддомены, а это уже «другой источник».
    # Важная особенность nginx: add_header НЕ складывается по уровням. Если
    # хоть один add_header написан внутри location, то ВСЕ заголовки, заданные
    # выше, для этого location пропадают. Поэтому ниже, в location'ах, кеш
    # задаётся директивой expires, а не add_header — так заголовки отсюда
    # доживают до ответа. Проверено curl'ом: с add_header в location из
    # четырёх заголовков доезжал ровно один.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.pivasik.org; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;

    # ── Разделы ─────────────────────────────────────────────────────────────
    # Файл один, адреса настоящие. Перечисляем разделы поимённо, а не отдаём
    # index.html на любой путь: иначе опечатка в адресе выглядела бы как
    # рабочая страница, и 404 не существовало бы в природе.
    location ~ ^/(services|journal|cluster)/?$ {
        expires -1;
        try_files /index.html =404;
    }

    # ── Шрифты ──────────────────────────────────────────────────────────────
    # Меняются примерно никогда, поэтому кешируются надолго. Если однажды
    # поменяются — у файла сменится имя, и старое имя просто перестанут просить.
    location /fonts/ {
        expires 30d;
        access_log off;
    }

    # ── Главная ─────────────────────────────────────────────────────────────
    # expires -1 даёт Cache-Control: no-cache. Это не «не хранить»: браузер
    # сохранит копию, но перед показом переспросит, не изменилась ли она.
    # Без этого правка страницы доезжала бы до вкладки только по Ctrl+F5.
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    # ── Ничего не нашли ─────────────────────────────────────────────────────
    # Отдаём ту же страницу, но с кодом 404: в ней есть свой раздел «такой
    # страницы нет», а код остаётся честным — и для браузера, и для того, кто
    # однажды придёт разбирать логи.
    # Без знака «=» перед именем nginx сохраняет исходный код ответа. Стоит
    # написать «error_page 404 = @notfound» — и код станет 200, потому что
    # так nginx берёт его у обработчика. Разница в один символ.
    error_page 404 @notfound;

    location @notfound {
        expires -1;
        try_files /index.html =404;
    }
}
