apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - loki-datasource.yaml

# дашборд собирается из обычного .json — править его теперь можно коммитом
configMapGenerator:
  - name: grafana-dashboard-loki
    files:
      - loki-logs.json=dashboards/loki-logs.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: "Логи"

generatorOptions:
  disableNameSuffixHash: true
