apiVersion: apps/v1
kind: Deployment
metadata:
  name: game
  namespace: sites
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game
  template:
    metadata:
      labels:
        app: game
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests: { memory: "16Mi", cpu: "10m" }
            limits:   { memory: "64Mi", cpu: "100m" }
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args: ["--nginx.scrape-uri=http://127.0.0.1/stub_status"]
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests: { memory: "16Mi", cpu: "10m" }
            limits:   { memory: "48Mi", cpu: "50m" }
      volumes:
        - name: html
          configMap:
            name: game-html
        - name: conf
          configMap:
            name: sites-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: game
  namespace: sites
  labels:
    app: game
    monitored: "true"
spec:
  selector:
    app: game
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: metrics
      port: 9113
      targetPort: 9113
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: game
  namespace: sites
spec:
  ingressClassName: traefik
  rules:
    - host: game.pivasik.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: game
                port:
                  number: 80
