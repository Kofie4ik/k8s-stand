apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: gitops-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: gitops-demo }
  template:
    metadata:
      labels: { app: gitops-demo }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5 
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 64Mi }
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: gitops-demo-html
