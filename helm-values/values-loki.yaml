deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 168h
    retention_stream:
      - selector: '{namespace="app-demo"}'
        priority: 10
        period: 720h                          # 30 суток — боевая база
      - selector: '{namespace="sites"}'
        priority: 5
        period: 72h                           # 3 суток — access-шум
      - selector: '{namespace="kube-system"}'
        priority: 5
        period: 72h

  compactor:
    working_directory: /var/loki/compactor
    delete_request_store: filesystem
    retention_enabled: true
    retention_delete_delay: 2h
    compaction_interval: 10m

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# выключаем всё, что нужно только в масштабируемых режимах
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false
gateway:
  enabled: false
