apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Kofie4ik/k8s-stand.git
    targetRevision: main
    path: manifests/gitops-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo

  syncPolicy:
    automated:
      prune: true      # удалять из кластера то, что убрали из git
      selfHeal: true   # возвращать как в git при ручных правках
    syncOptions:
      - CreateNamespace=true
