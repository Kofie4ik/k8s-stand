apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets                 # = имя Helm-релиза, менять нельзя
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.19.1             # контроллер v0.38.4
    helm:
      releaseName: sealed-secrets
      values: |
        # kubeseal по умолчанию ищет контроллер с именем sealed-secrets-controller,
        # а чарт называет его sealed-secrets — выравниваем, чтобы CLI работал без флагов
        fullnameOverride: sealed-secrets-controller
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
