apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy            # ← имя релиза Helm, менять нельзя
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # 1. сам чарт из репозитория Grafana, версия приколочена
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.11.0
      helm:
        valueFiles:
          - $values/helm-values/values-alloy.yaml

    # 2. наш git — только чтобы взять оттуда файл values
    - repoURL: https://github.com/Kofie4ik/k8s-stand.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
