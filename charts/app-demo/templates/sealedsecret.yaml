apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: pg-secret
  namespace: app-demo
  annotations:
    # страховка: случайное удаление файла из git не должно унести пароль БД.
    # Argo оставит объект, а не запрунит его вместе с каскадным Secret'ом
    argocd.argoproj.io/sync-options: Prune=false
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: pg-secret
      namespace: app-demo
    type: Opaque
