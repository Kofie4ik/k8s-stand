apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres-exporter, namespace: app-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres-exporter } }
  template:
    metadata: { labels: { app: postgres-exporter } }
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          env:
            - name: DATA_SOURCE_URI
              value: "postgres:5432/demodb?sslmode=disable"
            - name: DATA_SOURCE_USER
              value: "demo"
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: { name: pg-secret, key: POSTGRES_PASSWORD }
          ports:
            - { name: metrics, containerPort: 9187 }
          resources:
            requests: { memory: "32Mi", cpu: "20m" }
            limits:   { memory: "128Mi", cpu: "100m" }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: app-demo
  labels: { app: postgres-exporter }
spec:
  selector: { app: postgres-exporter }
  ports:
    - { name: metrics, port: 9187, targetPort: 9187 }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: app-demo
  labels: { release: monitoring }     # ← БЕЗ этой метки Prometheus его не подхватит
spec:
  selector:
    matchLabels: { app: postgres-exporter }
  endpoints:
    - { port: metrics, interval: 15s }
